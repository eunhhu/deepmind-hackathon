name: CD to GCP Cloud Run (Parallel API + Web)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target GCP environment"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cd-gcp-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'deepmind-argon' }}

permissions:
  contents: read
  id-token: write

jobs:
  # Gate deployment on fast parallel CI checks
  verify:
    uses: ./.github/workflows/ci.yml

  deploy-api:
    name: Deploy Go Gin API to Cloud Run
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF or SA Key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK & Configure Artifact Registry Docker Auth
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build & Push Go Gin API Image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/argon-api:${{ github.sha }}
        run: |
          docker build \
            --build-arg GOARCH=amd64 \
            -f apps/api/Dockerfile \
            -t "${IMAGE_URI}" \
            .
          docker push "${IMAGE_URI}"

      - name: Deploy API Service to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: argon-api
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/argon-api:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=20
            --concurrency=80
            --cpu=2
            --memory=1Gi
            --timeout=900
          env_vars: |
            GIN_MODE=release
          secrets: |
            GEMINI_API_KEY=GEMINI_API_KEY:latest

  deploy-web:
    name: Deploy SolidJS Web to Cloud Run
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF or SA Key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build & Push SolidJS Web Image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/argon-web:${{ github.sha }}
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t "${IMAGE_URI}" \
            .
          docker push "${IMAGE_URI}"

      - name: Deploy Web Service to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: argon-web
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/argon-web:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --concurrency=250
            --cpu=1
            --memory=256Mi
