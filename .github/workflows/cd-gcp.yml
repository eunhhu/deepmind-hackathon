name: CD to GCP Cloud Run (Parallel API + Web)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target GCP environment"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cd-gcp-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast3' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'deepmind-argon' }}
  CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE: /tmp/gcp_creds.json
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp_creds.json

permissions:
  contents: read
  id-token: write

jobs:
  # Gate deployment on fast parallel CI checks
  verify:
    uses: ./.github/workflows/ci.yml

  deploy-api:
    name: Deploy Go Gin API to Cloud Run
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GCP Credentials & Docker Registry Auth
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf "%s" "$GCP_SA_KEY" > /tmp/gcp_creds.json
          chmod 600 /tmp/gcp_creds.json
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev"

      - name: Build & Push Go Gin API Image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/argon-api:${{ github.sha }}
        run: |
          docker build \
            --build-arg TARGETARCH=amd64 \
            -f apps/api/Dockerfile \
            -t "${IMAGE_URI}" \
            .
          docker push "${IMAGE_URI}"

      - name: Deploy API Service to Cloud Run
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/argon-api:${{ github.sha }}
        run: |
          gcloud run deploy argon-api \
            --image="${IMAGE_URI}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=20 \
            --concurrency=80 \
            --cpu=2 \
            --memory=1Gi \
            --timeout=900 \
            --set-env-vars="GIN_MODE=release" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --quiet

      - name: Cleanup Credentials
        if: always()
        run: rm -f /tmp/gcp_creds.json

  deploy-web:
    name: Deploy SolidJS Web to Cloud Run
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GCP Credentials & Docker Registry Auth
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf "%s" "$GCP_SA_KEY" > /tmp/gcp_creds.json
          chmod 600 /tmp/gcp_creds.json
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev"

      - name: Build & Push SolidJS Web Image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/argon-web:${{ github.sha }}
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t "${IMAGE_URI}" \
            .
          docker push "${IMAGE_URI}"

      - name: Deploy Web Service to Cloud Run
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/argon-web:${{ github.sha }}
        run: |
          gcloud run deploy argon-web \
            --image="${IMAGE_URI}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=10 \
            --concurrency=250 \
            --cpu=1 \
            --memory=256Mi \
            --quiet

      - name: Cleanup Credentials
        if: always()
        run: rm -f /tmp/gcp_creds.json
